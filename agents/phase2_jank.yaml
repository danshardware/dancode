id: phase2_jank
name: Phase 2 — Jank Control
description: |
  Audits all files under Planning/<FeatureName>/ for implementation risk.
  Checks for lazy stub risk, test gaming, self-sabotage, convention violations,
  missing explicitness, and long-term debt. Applies fixes directly to plan files.

flows:
  main: phase2_jank

# Allow up to 100 tool calls per turn so the audit can read + fix all plan files
# without hitting the default 40-call limit mid-turn.
max_tool_calls_per_turn: 100

# Phases 1-3 receive developer-authored feature descriptions, not external user
# input. Disable the input_safety guardrail to prevent false positive rejections.
guardrails:
  input: ""

max_iterations: 40

model_defaults:
  provider: bedrock
  model_id: us.anthropic.claude-opus-4-5-20251101-v1:0

permissions:
  workspace_paths:
    - data/workspace/phase2_jank/
  allowed_commands: []
