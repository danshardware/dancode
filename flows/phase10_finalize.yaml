id: phase10_finalize
max_iterations: 20
start: compose_message

on_error:
  max_iterations:
    start: END
  unhandled:
    start: END

blocks:

  compose_message:
    type: llm
    system_prompt: |
      You are a finalization agent running Phase 10 of the dancode loop.

      REPO_PATH: {{state.repo_path}}
      FEATURE_NAME: {{state.feature_name}}
      FEATURE_BRANCH: {{state.feature_branch}}

      Read Planning/{{state.feature_name}}/REVIEW.md to understand what changed.

      Compose a squash commit message in this format:
        <short imperative title, max 72 chars>

        <What this feature does in 2-4 sentences. No jargon.>

        Changes:
        - <task-id>: <one-line summary>
        - <task-id>: <one-line summary>

        Tests: <number> tests added/modified, all passing.

      Check pyproject.toml for a version number under [project].
      If present, determine whether to bump patch (internal changes) or
      minor (new user-facing capability).

      Write the finalization instructions to:
        {{state.repo_path}}/Planning/{{state.feature_name}}/FINALIZE.md

      The file must contain:
      1. The composed commit message (in a code block)
      2. The version bump (old → new), if applicable
      3. The exact commands to run:

         git checkout main
         git merge --squash {{state.feature_branch}}
         git commit -m "<message>"
         git push origin main

      Never run these commands yourself. Output them for the human to execute.

      After writing FINALIZE.md, respond with action: done.

      Respond ONLY with valid YAML:
      ```yaml
      reasoning: "composing finalization instructions"
      action: read_file  # or: write_file | done
      action_input:
        path: "{{state.repo_path}}/Planning/{{state.feature_name}}/REVIEW.md"
      ```
    tools:
      - read_file
      - write_file
    transitions:
      read_file: read_file_block
      write_file: write_file_block
      done: present_output
      default: compose_message

  read_file_block:
    type: tool_call
    tool: read_file
    transitions:
      default: compose_message

  write_file_block:
    type: tool_call
    tool: write_file
    transitions:
      default: compose_message

  present_output:
    type: llm
    system_prompt: |
      Read Planning/{{state.feature_name}}/FINALIZE.md and present its contents
      clearly to the user. Add a note: "Review and run the commands above when ready.
      This tool will NOT push or merge anything automatically."

      Respond ONLY with valid YAML:
      ```yaml
      reasoning: "presenting finalization instructions"
      action: read_file
      action_input:
        path: "{{state.repo_path}}/Planning/{{state.feature_name}}/FINALIZE.md"
      ```
    tools:
      - read_file
    transitions:
      read_file: final_read_block
      done: END
      default: END

  final_read_block:
    type: tool_call
    tool: read_file
    transitions:
      default: END
