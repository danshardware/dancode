id: phase3_refine
max_iterations: 35
start: refine

on_error:
  max_iterations:
    start: END
  unhandled:
    start: END

blocks:

  refine:
    type: llm
    system_prompt: |
      You are a precision editor running Phase 3 (Refine) of the dancode loop.

      REPO_PATH: {{state.repo_path}}
      FEATURE_NAME: {{state.feature_name}}

      Read all files under {{state.repo_path}}/Planning/{{state.feature_name}}/ and apply
      the following checks. Edit plan files in-place. Do not add narrative — only add precision.

      1. Every function in "Type Contracts" must have:
         - A one-line docstring written exactly as the coding model should write it
         - All parameter types resolved (no "dict-like" or "see above")
         - A short (3-8 line) usage example if the function is non-trivial

      2. Every "Workflow" step must start with a file path in backticks. If a step does not
         reference a specific file, it is too vague — make it specific.

      3. Every "Acceptance Criteria" bullet must include a sample assertion:
           assert <thing> == <expected_value>
         or a CLI command + expected output. Remove any bullet that cannot be expressed this way.

      4. Every "Testing Plan" test must name the file it lives in and include a complete
         function stub (just the def line, docstring, and assert skeleton).
         The coding model will fill in the body.

      5. Check for implicit assumptions:
         - Does the plan assume a config key exists? Add the key name and default value.
         - Does the plan assume a directory exists? Add the mkdir call to the workflow.
         - Does the plan assume a prior task ran? Move the dependency to "Overview → depends on".

      6. Verify that the README.md execution map is still accurate after any additions.
         Update it if needed.

      Start by listing files, then read each, then edit using replace_in_file for targeted
      changes or write_file to rewrite a file entirely. When all files are updated, action: done.

      Respond ONLY with valid YAML:
      ```yaml
      reasoning: "what you are checking/fixing"
      action: list_files  # or: read_file | write_file | replace_in_file | done
      action_input:
        path: "{{state.repo_path}}/Planning/{{state.feature_name}}/"
      ```
    tools:
      - list_files
      - read_file
      - write_file
      - replace_in_file
    transitions:
      list_files: list_files_block
      read_file: read_file_block
      write_file: write_file_block
      replace_in_file: replace_in_file_block
      done: END
      default: refine

  list_files_block:
    type: tool_call
    tool: list_files
    transitions:
      default: refine

  read_file_block:
    type: tool_call
    tool: read_file
    transitions:
      default: refine

  write_file_block:
    type: tool_call
    tool: write_file
    transitions:
      default: refine

  replace_in_file_block:
    type: tool_call
    tool: replace_in_file
    transitions:
      default: refine
