id: phase4_dispatch
max_iterations: 30
start: dispatch_coordinator

on_error:
  max_iterations:
    start: END
  unhandled:
    start: END

blocks:

  dispatch_coordinator:
    type: llm
    system_prompt: |
      You are tasked with writing the coding dispatch documents for a software feature.

      REPO_PATH: {{state.repo_path}}
      FEATURE_NAME: {{state.feature_name}}

      PHASE 1 — READ THE PLAN:
      Use list_files and read_file to read Planning/{{state.feature_name}}/README.md
      and all task files under Planning/{{state.feature_name}}/.

      PHASE 2 — WRITE DISPATCH FILES:
      Once you have read all plan files, write one dispatch prompt per task to:
        {{state.repo_path}}/Planning/{{state.feature_name}}/dispatch/<track>/<task-id>-dispatch.md

      Each dispatch file must contain exactly:

      ---
      TASK: <task file title>
      SOURCE PLAN: Planning/{{state.feature_name}}/<track>/<task-file>.md
      ---

      Read the source plan file listed above. Then:

      You will run inside a single pre-created feature worktree that is already
      on the correct feature branch. Do not create or switch branches.

      1. Read every file listed in the "Files Changed" section of the plan.
         Do not edit anything yet — understand first.

      2. Implement the changes described in the "Workflow" section step by step.
         After each numbered step, stop and verify the change compiles / imports cleanly.

      3. Commit with message: "<task-id>: <task title> — initial implementation"

      4. Write the tests described in "Testing Plan". Run them. Fix any failures.

      5. Commit with message: "<task-id>: <task title> — tests passing"

      6. Verify every item in "Acceptance Criteria" is satisfied. For each item,
         output the assertion or command and its result.

      7. If any criterion fails, fix it now. Do not move on with a failing criterion.

      8. Final commit with message: "<task-id>: <task title> — complete"

      Do not proceed to the next task. Stop here and report: DONE or BLOCKED: <reason>.
      ---

      PHASE 3 — WRITE SCHEDULE:
      After all dispatch files are written, write the execution schedule to:
        {{state.repo_path}}/Planning/{{state.feature_name}}/dispatch/SCHEDULE.md

      The schedule must list:
      - Tasks that can run in parallel (no shared files)
      - Tasks that must run sequentially (with dependency explanation)

      When the schedule is written, respond with action: done.

      Respond ONLY with valid YAML:
      ```yaml
      reasoning: "what you are doing"
      action: list_files  # or: read_file | write_file | done
      action_input:
        path: "..."
      ```
    tools:
      - list_files
      - read_file
      - write_file
    transitions:
      list_files: list_files_block
      read_file: read_file_block
      write_file: write_file_block
      done: END
      default: dispatch_coordinator

  list_files_block:
    type: tool_call
    tool: list_files
    transitions:
      default: dispatch_coordinator

  read_file_block:
    type: tool_call
    tool: read_file
    transitions:
      default: dispatch_coordinator

  write_file_block:
    type: tool_call
    tool: write_file
    transitions:
      default: dispatch_coordinator
