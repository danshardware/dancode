id: phase5_code
max_iterations: 8
start: coordinator

# Per-task flow — called once per task by run_loop.py.
# Does exactly 3 things: create-worktree → code → QA.
# run_loop.py handles reading/copying the review and writing phase5_status.md.
#
# Required state variables (set by run_loop.py):
#   task_id            e.g. "001"
#   track_name         e.g. "track-a"
#   dispatch_file      absolute path to the coding dispatch .md file
#   worktree_path      absolute path to the task worktree (pre-computed)
#   repo_path          absolute path to main repo
#   feature_name       e.g. "usability-improvements"
#   openhands_model    e.g. "minimax.minimax-m2.5"

on_error:
  max_iterations:
    start: END
  unhandled:
    start: END

blocks:

  coordinator:
    type: llm
    system_prompt: |
      Execute Phase 5 for ONE task. Do these 3 steps in order. ONE action per response.

      TASK:     {{state.task_id}}
      WORKTREE: {{state.worktree_path}}
      DISPATCH: {{state.dispatch_file}}
      MODEL:    {{state.openhands_model}}
      FEATURE:  {{state.feature_name}}
      REPO:     {{state.repo_path}}
      TRACK:    {{state.track_name}}

      STEP 1 — Create/get worktree:
        ```yaml
        action: git_worktree_create
        action_input:
          repo_path: "{{state.repo_path}}"
          branch: "{{state.feature_name}}/{{state.track_name}}/{{state.task_id}}"
          dest_path: "{{state.worktree_path}}"
        ```
        "[ERROR] Destination already exists" is OK — the worktree is ready.

      STEP 2 — Code the task:
        ```yaml
        action: openhands_dispatch
        action_input:
          worktree_path: "{{state.worktree_path}}"
          dispatch_file: "{{state.dispatch_file}}"
          model_id: "{{state.openhands_model}}"
        ```

      STEP 3 — QA review:
        ```yaml
        action: openhands_dispatch
        action_input:
          worktree_path: "{{state.worktree_path}}"
          model_id: "{{state.openhands_model}}"
          dispatch_content: |
            Review the code changes in this repository.
            1. Run: git log --oneline -5
            2. Run: git diff HEAD~1 HEAD
            3. Read the task spec at: {{state.dispatch_file}}
            4. Write your complete review to:
               Planning/{{state.feature_name}}/reviews/{{state.task_id}}-review.md
            End the review file with EXACTLY ONE of:
            VERDICT: PASS
            VERDICT: PASS WITH NOTES
            VERDICT: FAIL
            (If FAIL, list each blocking issue starting with "- ")
        ```

      After STEP 3 completes, emit:
      ```yaml
      action: done
      ```
      NEVER read or write files yourself. NEVER retry any step.
    tools:
      - git_worktree_create
      - openhands_dispatch
    transitions:
      git_worktree_create: git_worktree_block
      openhands_dispatch: openhands_block
      done: END
      default: coordinator

  git_worktree_block:
    type: tool_call
    tool: git_worktree_create
    transitions:
      default: coordinator

  openhands_block:
    type: tool_call
    tool: openhands_dispatch
    transitions:
      default: coordinator


