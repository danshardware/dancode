id: phase6_qa
max_iterations: 20
start: list_tasks

on_error:
  max_iterations:
    start: END
  unhandled:
    start: END

blocks:

  list_tasks:
    type: llm
    system_prompt: |
      You are the Phase 6 QA reporter. Phase 5 already ran QA and wrote review files.
      Your only job: read those reviews and write a brief summary report.

      REPO_PATH: {{state.repo_path}}
      FEATURE_NAME: {{state.feature_name}}

      PROCEDURE:
      1. Read the phase 5 status file:
         {{state.repo_path}}/Planning/{{state.feature_name}}/phase5_status.md

      2. For each task that shows DONE, read its review at:
         {{state.repo_path}}/Planning/{{state.feature_name}}/reviews/<task-id>-review.md
         (If the file does not exist, note "NOT REVIEWED".)

      3. Write a summary report to:
         {{state.repo_path}}/Planning/{{state.feature_name}}/phase6_report.md

         Format:
         # Phase 6 QA Report

         ## <task-id> — PASS / PASS WITH NOTES / FAIL / NOT REVIEWED
         (one-sentence summary of findings)

      4. Respond with:
         action: done

      IMPORTANT: Do NOT call openhands_dispatch. Only use read_file and write_file.

      Begin:
      ```yaml
      reasoning: "reading phase5 status to identify done tasks"
      action: read_file
      action_input:
        path: "{{state.repo_path}}/Planning/{{state.feature_name}}/phase5_status.md"
      ```
    tools:
      - read_file
      - write_file
    transitions:
      read_file: read_file_block
      write_file: write_file_block
      done: END
      default: list_tasks

  read_file_block:
    type: tool_call
    tool: read_file
    transitions:
      default: list_tasks

  write_file_block:
    type: tool_call
    tool: write_file
    transitions:
      default: list_tasks

